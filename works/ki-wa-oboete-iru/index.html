<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木は覚えている</title>
  <meta name="description" content="五重塔の柔らかい構造と心柱、千年の年輪。地震・雨・雪・風を画面で操作し、木がそれを年輪に刻む p5.js の作品。">
  <meta name="theme-color" content="#3a4656">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <!-- SNS で共有したときのカード。画像は pnpm capture で撮ったもの（GitHub Pages の https://boxpistols.github.io/p5-sketch/ を前提） -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="木は覚えている">
  <meta property="og:description" content="五重塔の柔らかい構造と心柱、千年の年輪。地震・雨・雪・風を画面で操作し、木がそれを年輪に刻む。">
  <meta property="og:url" content="https://boxpistols.github.io/p5-sketch/works/ki-wa-oboete-iru/">
  <meta property="og:image" content="https://boxpistols.github.io/p5-sketch/works/ki-wa-oboete-iru/capture.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    /* 墨と朱の作品に合わせ、地を和紙色にする */
    html, body { margin: 0; min-height: 100%; background: #bfb08f; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px 0; box-sizing: border-box; }
    /* 画素数は 1200×720 のまま、表示だけ窓に収まるよう縮める（CPU の負荷は変わらない） */
    canvas { display: block; width: min(calc(100vw - 32px), calc((100vh - 150px) * 1200 / 720)) !important; height: auto !important; aspect-ratio: 1200 / 720; }
  </style>
  <script src="../../lib/p5-2.4.0.min.js"></script>
  <script src="sketch.js"></script>
</head>

</html>
