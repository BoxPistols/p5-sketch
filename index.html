<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>p5 sketches</title>
  <meta name="description" content="p5.js で作った作品の一覧。ブラウザの中で動かして触れる。">
  <meta name="theme-color" content="#3a4656">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="p5 sketches">
  <meta property="og:description" content="p5.js で作った作品の一覧。ブラウザの中で動かして触れる。">
  <meta property="og:url" content="https://boxpistols.github.io/p5-sketch/">
  <meta property="og:image" content="https://boxpistols.github.io/p5-sketch/works/ki-wa-oboete-iru/capture.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root { --paper: #e2d4b8; --ink: #241c16; --shu: #ac422c; --muted: #6a5c4c; } /* 作品と同じ、焼けた和紙・褪せた朱 */
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { font: 15px/1.7 serif; padding: 40px 16px 64px; }
    main { max-width: 1080px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: normal; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px; }
    a { color: inherit; text-decoration: none; display: block; }
    a:focus-visible { outline: 2px solid var(--shu); outline-offset: 4px; }
    img { width: 100%; aspect-ratio: 1240 / 860; object-fit: cover; display: block; background: #d9cfbb; }
    h2 { font-size: 18px; font-weight: normal; margin: 10px 0 2px; }
    a:hover h2 { color: var(--shu); }
    p { margin: 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>p5 sketches</h1>
    <p class="lead">p5.js で作った作品。画像を選ぶと、ブラウザの中で動きます。</p>
    <ul id="works"></ul>
  </main>
  <script>
    // works.json の並びをそのまま一覧にする。作品を足すときは works.json に 1 件足す
    fetch('works.json')
      .then((r) => r.json())
      .then((works) => {
        const list = document.getElementById('works');
        for (const w of works) {
          const li = document.createElement('li');
          li.innerHTML = `<a href="works/${w.slug}/">
            <img src="works/${w.slug}/capture.png" alt="" loading="lazy">
            <h2></h2><p></p></a>`;
          li.querySelector('h2').textContent = w.title;
          li.querySelector('p').textContent = w.summary;
          list.append(li);
        }
      })
      .catch(() => {
        document.getElementById('works').textContent = '作品の一覧を読めませんでした。pnpm dev で開いてください（file:// では読めません）。';
      });
  </script>
</body>
</html>
